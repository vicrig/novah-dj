<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Lato:wght@300;400;700;900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#070b16; --bg2:#0e1730;
    --cyan:#5fd2e8; --blue:#4a86d8; --oro:#d8b65a; --verde:#54e0a0; --rojo:#ef8f7a;
    --glass:rgba(28,44,80,.42); --glass-2:rgba(40,60,104,.55);
    --glass-brd:rgba(130,190,235,.40); --glow:rgba(95,210,232,.55);
    --text:#eaf1fb; --muted:#9fb3d2; --dim:#62748f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden}
  body{font-family:'Lato',sans-serif;color:var(--text);background:#05070d;display:flex;align-items:center;justify-content:center;user-select:none}
  .holo{position:relative;width:min(1240px,calc(100% - 36px));height:min(760px,calc(100% - 36px));border-radius:28px;overflow:hidden;
       background:radial-gradient(900px 620px at 72% 28%,#1b2c54 0%,#0e1730 45%,#070b16 100%);
       border:1px solid rgba(130,190,235,.5);
       box-shadow:0 0 0 1px rgba(95,210,232,.14),0 0 26px rgba(95,210,232,.38),inset 0 0 70px rgba(95,210,232,.07);
       animation:encender .75s cubic-bezier(.2,.8,.2,1) both}
  .holo::before{content:'';position:absolute;inset:0;pointer-events:none;opacity:.5;
       background:radial-gradient(520px 420px at 78% 30%,var(--glow) 0%,transparent 62%),radial-gradient(420px 420px at 8% 92%,rgba(74,134,216,.45) 0%,transparent 62%)}
  .holo::after{content:'';position:absolute;inset:0;pointer-events:none;opacity:.22;
       background-image:linear-gradient(rgba(130,190,235,.6) 1px,transparent 1px),linear-gradient(90deg,rgba(130,190,235,.6) 1px,transparent 1px);
       background-size:44px 44px;-webkit-mask:radial-gradient(circle at 38% 55%,#000 0%,rgba(0,0,0,.55) 60%,transparent 90%)}
  @keyframes encender{0%{opacity:0;transform:scaleX(.15) scaleY(.004);filter:brightness(3)}28%{opacity:1;transform:scaleX(1) scaleY(.004);filter:brightness(3)}70%{transform:scaleX(1) scaleY(1.015);filter:brightness(1.25)}100%{opacity:1;transform:none;filter:none}}

  .barra{position:absolute;top:0;left:0;right:0;height:64px;z-index:6;display:flex;align-items:center;justify-content:space-between;padding:0 22px 0 26px}
  .marca{display:flex;align-items:center;gap:10px;font-size:.68rem;letter-spacing:.22em;text-transform:uppercase;font-weight:700;color:var(--cyan)}
  .marca .ini{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-family:'Playfair Display',serif;font-style:italic;font-weight:600;font-size:.95rem;letter-spacing:0;color:#06223a;background:linear-gradient(135deg,var(--cyan),var(--blue));box-shadow:0 0 16px var(--glow)}
  .pestanas{display:flex;gap:6px;margin-left:22px}
  .pest{font-family:inherit;font-size:.7rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:7px 16px;border-radius:20px;cursor:pointer;
        border:1px solid var(--glass-brd);background:rgba(10,20,40,.45);color:var(--muted)}
  .pest.on{color:#06223a;background:linear-gradient(135deg,var(--cyan),var(--blue));box-shadow:0 0 16px var(--glow);border-color:transparent}
  .reloj{display:flex;align-items:center;gap:16px}
  .hora{font-family:'Playfair Display',serif;font-size:1.45rem;font-weight:500;font-variant-numeric:tabular-nums;text-shadow:0 0 18px rgba(95,210,232,.35)}
  .fecha{font-size:.7rem;color:var(--muted);letter-spacing:.06em;text-align:right;line-height:1.35}
  .cerrar{width:34px;height:34px;border-radius:50%;border:1px solid var(--glass-brd);background:rgba(10,20,40,.45);color:var(--muted);font-size:1rem;display:grid;place-items:center}

  .figura{position:absolute;right:0;top:0;bottom:0;width:40%;z-index:1;pointer-events:none;overflow:hidden;
       -webkit-mask-image:linear-gradient(to left,#000 38%,transparent 96%);mask-image:linear-gradient(to left,#000 38%,transparent 96%)}
  .figura .img{position:absolute;inset:-14px;background:url('hoy/fondo.png') center 8%/cover no-repeat;filter:saturate(.9) contrast(1.06) brightness(.82)}
  .figura::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(95,210,232,.075) 0 1px,transparent 1px 3px);mix-blend-mode:screen}

  /* ---------- HOY ---------- */
  /* placa fotografiada en perspectiva: una franja enfocada y lo demás desenfocado (como una foto macro) */
  .luces{overflow:hidden;-webkit-mask-image:linear-gradient(to right,#000 0%,#000 66%,transparent 96%);mask-image:linear-gradient(to right,#000 0%,#000 66%,transparent 96%)}
  .camara{position:absolute;left:-30%;right:-30%;top:-10%;bottom:-40%;perspective:900px;perspective-origin:50% 0%}
  .camara canvas{position:absolute;inset:0;width:100%;height:100%;transform-origin:50% 100%;transform:rotateX(52deg) scale(1.05)}
  #placaBorrosa{filter:blur(6px) brightness(.85);opacity:.75}
  #placaNitida{filter:blur(.6px);-webkit-mask-image:linear-gradient(to bottom,transparent 38%,#000 58%,#000 70%,transparent 86%);mask-image:linear-gradient(to bottom,transparent 38%,#000 58%,#000 70%,transparent 86%);opacity:.9}
  .niebla{position:absolute;inset:0;pointer-events:none;
         background:linear-gradient(to bottom,rgba(7,11,22,.85) 0%,rgba(7,11,22,.35) 30%,rgba(7,11,22,.15) 60%,rgba(7,11,22,.55) 100%),
                    radial-gradient(ellipse 70% 60% at 45% 60%,transparent 40%,rgba(7,11,22,.55) 100%)}
  .luces{position:absolute;left:0;top:0;bottom:0;width:72%;z-index:2;pointer-events:none;
         background:radial-gradient(260px 200px at 18% 42%,rgba(216,182,90,.10),transparent 70%),
                    radial-gradient(300px 220px at 62% 70%,rgba(74,134,216,.28),transparent 70%),
                    radial-gradient(220px 160px at 45% 22%,rgba(216,182,90,.10),transparent 70%)}
  .izq{position:absolute;left:0;top:64px;bottom:0;width:72%;z-index:4;padding:6px 34px 26px 44px;display:flex;flex-direction:column;gap:14px}
  .cab{display:flex;align-items:flex-end;justify-content:space-between;gap:20px}
  .saludo h1{font-family:'Playfair Display',serif;font-style:italic;font-weight:500;font-size:2.1rem;text-shadow:0 0 24px rgba(95,210,232,.35)}
  .saludo .sub{color:var(--muted);font-size:.9rem;margin-top:4px}
  .progreso{display:flex;align-items:center;gap:14px}
  .anillo{width:74px;height:74px;position:relative}
  .anillo svg{transform:rotate(-90deg)}
  .anillo .num{position:absolute;inset:0;display:grid;place-items:center;font-family:'Playfair Display',serif;font-size:1.25rem}
  .anillo .num small{display:block;font-family:'Lato';font-size:.55rem;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;text-align:center;margin-top:-4px}
  /* BOLA DE CRISTAL (14/11, su imagen de referencia): circuitos dentro que se ENCIENDEN al marcar tareas */
  .progreso{gap:22px}
  .esfera-caja{display:flex;align-items:center;gap:14px}
  .esfera{position:relative;width:150px;height:150px;border-radius:50%;
          box-shadow:0 0 34px rgba(95,210,232,.32),0 22px 34px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.18)}
  .esfera canvas{width:100%;height:100%;border-radius:50%;display:block}
  .esfera::after{content:'';position:absolute;inset:0;border-radius:50%;pointer-events:none;
          background:radial-gradient(circle at 50% 50%,transparent 56%,rgba(200,235,255,.06) 70%,rgba(220,245,255,.28) 88%,rgba(255,255,255,.7) 97%,rgba(255,255,255,.2) 100%)}
  .esfera .reflejo{position:absolute;left:17%;top:9%;width:40%;height:25%;border-radius:50%;pointer-events:none;transform:rotate(-24deg);
          background:radial-gradient(ellipse at 45% 45%,rgba(255,255,255,.85),rgba(255,255,255,.25) 50%,transparent 74%);filter:blur(1.5px)}
  .esfera .reflejo.r2{left:62%;top:72%;width:20%;height:9%;transform:rotate(-30deg);opacity:.35}
  .esfera{animation:flota 6s ease-in-out infinite}
  @keyframes flota{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .esfera .reflejo{animation:respira 6s ease-in-out infinite}
  @keyframes respira{50%{opacity:.7}}
  .esfera.destello{animation:flota 6s ease-in-out infinite,destello .9s ease}
  @keyframes destello{40%{box-shadow:0 0 70px rgba(95,210,232,.75),0 22px 34px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.3)}}
  .cuenta{font-family:'Playfair Display',serif;font-size:1.7rem;line-height:1;text-shadow:0 0 18px rgba(95,210,232,.35)}
  .cuenta small{display:block;font-family:'Lato';font-size:.6rem;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:6px}
  .escuchar{font-family:inherit;font-size:.82rem;font-weight:700;padding:11px 18px;border-radius:12px;cursor:pointer;border:none;color:#06223a;
            background:linear-gradient(135deg,var(--cyan),var(--blue));box-shadow:0 0 20px rgba(95,210,232,.4);display:flex;align-items:center;gap:8px}
  .escuchar.hablando{animation:late 1s ease-in-out infinite}
  @keyframes late{50%{filter:brightness(1.35);box-shadow:0 0 34px var(--glow)}}

  .lista{flex:1;display:flex;flex-direction:column;gap:10px;overflow:auto;padding-right:6px}
  /* CRISTAL CON LENTE (14/11, referencia: la esfera de cristal con circuitos): casi sin color, el fondo se ve DEFORMADO
     en los bordes como a través de un cristal grueso (filtro SVG #lente), canto brillante y un reflejo blanco arriba a la izquierda. */
  .tarea{position:relative;display:flex;align-items:center;gap:16px;padding:14px 16px 14px 14px;border-radius:22px;
         background:radial-gradient(ellipse 70% 120% at 42% 50%,rgba(5,10,24,.46),rgba(5,10,24,.18) 72%,transparent 100%),linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0) 40%,rgba(140,210,255,.04));
         backdrop-filter:url(#lente) brightness(1.18) saturate(150%);-webkit-backdrop-filter:url(#lente) brightness(1.18) saturate(150%);
         box-shadow:inset 0 0 0 1px rgba(255,255,255,.22),inset 0 1.5px 1px rgba(255,255,255,.65),inset 0 -1.5px 1px rgba(160,220,255,.25),
                    inset 0 0 16px rgba(255,255,255,.10),inset 0 0 3px rgba(255,255,255,.25),0 0 22px rgba(95,210,232,.10);transition:box-shadow .35s}
  .tarea::before{content:'';position:absolute;inset:0;pointer-events:none;border-radius:inherit;z-index:0;
         background:radial-gradient(ellipse 60% 140% at 50% 50%,transparent 62%,rgba(200,235,255,.10) 88%,rgba(255,255,255,.20) 100%)}
  .tarea::after{content:'';position:absolute;left:3%;top:3px;width:26%;height:44%;pointer-events:none;border-radius:50%;z-index:0;
         background:radial-gradient(ellipse at 40% 40%,rgba(255,255,255,.42),rgba(255,255,255,.10) 45%,transparent 72%);filter:blur(2px);opacity:.75}
  .tarea:hover{box-shadow:inset 0 0 0 1px rgba(255,255,255,.3),inset 0 1.5px 1px rgba(255,255,255,.8),inset 0 0 20px rgba(255,255,255,.14),0 0 28px rgba(95,210,232,.25)}
  .tarea>*{position:relative;z-index:1}
  .tarea.urgente{box-shadow:inset 0 0 0 1px rgba(240,215,138,.45),inset 0 1.5px 1px rgba(255,240,190,.8),inset 0 0 16px rgba(216,182,90,.14),0 0 26px rgba(216,182,90,.22)}
  .casilla{flex:0 0 46px;height:46px;border-radius:50%;border:2px solid rgba(130,190,235,.45);background:transparent;cursor:pointer;
           display:grid;place-items:center;transition:all .25s}
  .casilla:hover{border-color:var(--cyan);box-shadow:0 0 16px var(--glow)}
  .casilla svg{opacity:0;transform:scale(.4);transition:all .3s cubic-bezier(.3,1.6,.5,1)}
  .tarea.hecha .casilla{background:var(--verde);border-color:var(--verde);box-shadow:0 0 18px rgba(84,224,160,.6)}
  .tarea.hecha .casilla svg{opacity:1;transform:none}
  .cuerpo{flex:1;min-width:0;text-shadow:0 1px 8px rgba(2,6,16,.9)}
  .cuerpo .t{font-family:'Playfair Display',serif;font-size:1.22rem;line-height:1.2;transition:all .3s}
  .cuerpo .d{font-size:.8rem;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .cuerpo .d b{color:var(--cyan);font-weight:700}
  .etq{font-size:.58rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 9px;border-radius:20px;border:1px solid var(--glass-brd);color:var(--muted);margin-left:8px;vertical-align:middle;font-family:'Lato'}
  .etq.oro{color:var(--oro);border-color:rgba(216,182,90,.6)}
  .tarea.hecha .t{color:var(--dim);text-decoration:line-through;text-decoration-color:rgba(84,224,160,.7)}
  .tarea.hecha{opacity:.62}
  .abrir{flex:0 0 auto;font-family:inherit;font-size:.78rem;font-weight:700;padding:9px 15px;border-radius:10px;cursor:pointer;
         border:1px solid rgba(255,255,255,.18);border-top-color:rgba(255,255,255,.4);background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.03));box-shadow:inset 0 1px 0 rgba(255,255,255,.25);color:var(--text)}
  .abrir:hover{border-color:var(--cyan);box-shadow:0 0 14px rgba(95,210,232,.35)}

  .pie{display:flex;gap:12px}
  .mini{flex:1;padding:12px 16px;border-radius:14px;border:1px solid rgba(255,255,255,.12);border-top-color:rgba(255,255,255,.28);background:linear-gradient(135deg,rgba(255,255,255,.06),rgba(255,255,255,.02));backdrop-filter:blur(12px) saturate(160%);box-shadow:inset 0 1px 0 rgba(255,255,255,.2);font-size:.8rem;color:var(--muted);line-height:1.55}
  .mini h4{font-size:.62rem;letter-spacing:.16em;text-transform:uppercase;color:var(--cyan);margin-bottom:4px}

  /* aviso de las 18:30 */
  .tarde{position:absolute;right:30px;bottom:30px;z-index:8;width:340px;padding:18px 20px;border-radius:18px;
         background:linear-gradient(160deg,rgba(80,52,20,.75),rgba(40,30,20,.75));backdrop-filter:blur(14px);border:1px solid rgba(216,182,90,.7);
         box-shadow:0 0 40px rgba(216,182,90,.35);transform:translateY(30px);opacity:0;pointer-events:none;transition:all .45s}
  .tarde.ver{transform:none;opacity:1;pointer-events:auto}
  .tarde h3{font-family:'Playfair Display',serif;font-weight:500;font-size:1.25rem;color:#f4dfa0;margin-bottom:6px}
  .tarde p{font-size:.86rem;color:#ecdcc0;line-height:1.5}
  .tarde .bot{margin-top:12px;display:flex;gap:8px}
  .tarde button{font-family:inherit;font-size:.76rem;font-weight:700;padding:7px 12px;border-radius:9px;cursor:pointer;border:1px solid rgba(216,182,90,.6);background:rgba(20,14,6,.5);color:#f4dfa0}

  .aviso{position:absolute;left:33%;bottom:24px;z-index:9;transform:translateX(-50%) translateY(14px);opacity:0;max-width:600px;text-align:center;
       background:var(--glass-2);backdrop-filter:blur(10px);border:1px solid var(--glass-brd);padding:10px 16px;border-radius:12px;font-size:.84rem;transition:all .25s}
  .aviso.ver{opacity:1;transform:translateX(-50%)}

  .demo{position:fixed;left:14px;top:12px;z-index:20;font-size:.72rem;color:#8a97ad;display:flex;gap:8px;align-items:center}
  .demo button{font-family:inherit;font-size:.72rem;padding:5px 10px;border-radius:8px;border:1px solid #33415c;background:#0c1322;color:#cfe0f5;cursor:pointer}

  
  .orbe{position:absolute;border-radius:50%;pointer-events:none;z-index:2;filter:blur(90px)}
  .orbe.o1{width:420px;height:320px;left:6%;top:30%;background:#0ea5e9;opacity:.22;animation:deriva1 18s ease-in-out infinite}
  .orbe.o2{width:460px;height:360px;left:34%;top:52%;background:#1e3a8a;opacity:.55;animation:deriva2 22s ease-in-out infinite}
  .orbe.o3{width:300px;height:300px;right:6%;top:14%;background:#0ea5e9;opacity:.12}
  @keyframes deriva1{50%{transform:translate(60px,-30px)}}
  @keyframes deriva2{50%{transform:translate(-70px,20px)}}
  .saludo h1,.cuerpo .t,.cuenta,.tarde h3{font-family:'Plus Jakarta Sans',sans-serif;font-style:normal;letter-spacing:-.01em}
  .saludo h1{font-weight:600;font-size:2.05rem}
  .cuerpo .t{font-weight:600;font-size:1.08rem}
  .cuenta{font-weight:600}
  .etq,.mini h4,.cuenta small,.pest,.marca{letter-spacing:.2em}
  body{font-family:'Plus Jakarta Sans','Lato',sans-serif}

  .lista{perspective:1200px;gap:12px}
  .tarea{border-radius:18px;transform-style:preserve-3d;
         background:radial-gradient(260px 120px at var(--mx,30%) var(--my,0%),rgba(160,230,255,.10),transparent 70%),
                    linear-gradient(135deg,rgba(255,255,255,.09) 0%,rgba(255,255,255,.02) 100%);
         backdrop-filter:url(#lente) blur(18px) saturate(140%);-webkit-backdrop-filter:url(#lente) blur(18px) saturate(140%);
         border:1px solid rgba(255,255,255,.08);border-top:1px solid rgba(160,230,255,.35);
         box-shadow:0 12px 32px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.15);
         transition:transform .25s ease,box-shadow .3s,opacity .4s,padding .4s,background .3s;
         animation:aparece .6s cubic-bezier(.2,.8,.2,1) both}
  .tarea:nth-child(2){animation-delay:.06s}.tarea:nth-child(3){animation-delay:.12s}.tarea:nth-child(4){animation-delay:.18s}.tarea:nth-child(5){animation-delay:.24s}
  @keyframes aparece{from{opacity:0;transform:translateY(14px) translateZ(-40px)}}
  .tarea::before{background:none}
  .tarea::after{opacity:.45}
  .tarea:hover{transform:translateY(-2px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg));border-top-color:rgba(95,210,232,.85);
         box-shadow:0 18px 40px rgba(0,0,0,.5),0 0 26px rgba(14,165,233,.22),inset 0 1px 0 rgba(160,230,255,.35)}
  .tarea.urgente{border-top-color:rgba(240,215,138,.8);box-shadow:0 12px 32px rgba(0,0,0,.45),0 0 24px rgba(216,182,90,.18),inset 0 1px 0 rgba(255,240,190,.3)}
  /* HECHAS: se hunden hacia el fondo */
  .tarea.hecha{opacity:.45;padding-top:8px;padding-bottom:8px;border-top-color:rgba(255,255,255,.06);
         background:linear-gradient(135deg,rgba(0,0,0,.25),rgba(0,0,0,.12));box-shadow:none;transform:scale(.985)}
  .tarea.hecha::after{display:none}
  .tarea.hecha .t{font-size:.98rem}
  .tarea.hecha .d{display:none}

  /* CASILLAS = bolitas de cristal (como la bola grande) */
  .casilla{flex:0 0 40px;height:40px;border:none;position:relative;
           background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.35),rgba(255,255,255,.06) 32%,rgba(10,30,50,.55) 70%,rgba(160,230,255,.25) 100%);
           box-shadow:inset 0 0 0 1px rgba(255,255,255,.25),inset 0 -6px 10px rgba(0,0,0,.35),0 4px 10px rgba(0,0,0,.4)}
  .casilla:hover{box-shadow:inset 0 0 0 1px rgba(160,230,255,.6),inset 0 -6px 10px rgba(0,0,0,.35),0 0 16px rgba(14,165,233,.45)}
  .tarea.hecha .casilla{flex-basis:32px;height:32px;
           background:radial-gradient(circle at 35% 30%,rgba(255,255,255,.7),rgba(120,255,200,.6) 30%,rgba(30,160,110,.85) 72%,rgba(160,255,215,.5) 100%);
           box-shadow:inset 0 0 0 1px rgba(255,255,255,.35),0 0 14px rgba(84,224,160,.55)}
  .tarea.hecha .casilla svg{width:16px;height:16px}

  /* botones */
  .abrir{border-radius:999px;padding:8px 16px;background:rgba(14,165,233,.06);border:1px solid rgba(95,210,232,.32);color:#cfeffc;box-shadow:none;backdrop-filter:blur(6px)}
  .abrir:hover{background:rgba(14,165,233,.18);border-color:rgba(95,210,232,.85);color:#fff;box-shadow:0 0 18px rgba(14,165,233,.45),inset 0 0 10px rgba(95,210,232,.15)}
  .escuchar{border-radius:999px;box-shadow:0 0 24px rgba(14,165,233,.55),0 0 60px rgba(14,165,233,.25),inset 0 1px 0 rgba(255,255,255,.5)}
  .esfera{box-shadow:0 0 40px rgba(14,165,233,.45),0 0 90px rgba(14,165,233,.18),0 22px 34px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.18)}
  .mini{background:linear-gradient(135deg,rgba(255,255,255,.07),rgba(255,255,255,.015));backdrop-filter:blur(18px) saturate(140%);
        border:1px solid rgba(255,255,255,.07);border-top:1px solid rgba(160,230,255,.28);box-shadow:0 12px 28px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.12)}

  /* 14/11 · detrás de las tareas un FONDO DIFUMINADO (la escena del holograma muy desenfocada + puntos de luz) y
     las tarjetas MÁS TRANSPARENTES, para que se vea a través y dé profundidad */
  .difuso{position:absolute;left:-8%;top:-8%;width:82%;height:116%;z-index:1;pointer-events:none;

  // Tareas de EJEMPLO para la maqueta de NOVAH (David Pando): se cambiarán por las de su calendario.
  const TAREAS = [{"t": "Reunión con un cliente en obra", "d": "10:00 · De tu calendario (ejemplo)", "etq": "Reunión", "urgente": true, "hecha": false}, {"t": "Llamar al proveedor de iluminación", "d": "Pendiente de tu lista (ejemplo)", "etq": "Llamada", "urgente": false, "hecha": false}, {"t": "Comida con un interiorista", "d": "13:30 · De tu calendario (ejemplo)", "etq": "Comida", "urgente": false, "hecha": false}, {"t": "Revisar el catálogo de House Collection", "d": "Pendiente de tu lista (ejemplo)", "etq": "House", "urgente": false, "hecha": false}, {"t": "Pasar por el showroom", "d": "18:00 · De tu calendario (ejemplo)", "etq": "Showroom", "urgente": false, "hecha": false}];

  function pintar(){
    // 15/11 (Gemini + Claude): las hechas bajan al final; las pendientes arriba, en su orden
    const orden = TAREAS.map((x,i)=>[x,i]).sort((a,b)=>(!!a[0].hecha-!!b[0].hecha)||(a[1]-b[1]));
    $('#lista').innerHTML = orden.map(([x,i])=>`
      <div class="tarea ${x.hecha?'hecha':''} ${x.urgente&&!x.hecha?'urgente':''}" data-i="${i}">
        <div class="casilla" title="Marcar como hecha">${CHECK}</div>
        <div class="cuerpo"><div class="t">${x.t}${x.etq?'<span class="etq '+(x.oro?'oro':'')+'">'+x.etq+'</span>':''}</div>
          <div class="d">${x.hora?'🕑 '+x.hora+' · ':''}${x.d||''}</div></div>
      </div>`).join('');
    const h = TAREAS.filter(x=>x.hecha).length, n = TAREAS.length;
    $('#nHechas').textContent = h; $('#nTotal').textContent = n;
    Bola.luz(n? h/n : 0);
    const faltan = n-h;
    $('#resumen').textContent = faltan ? `Hoy tienes ${n} cosas. Te faltan ${faltan}.` : '¡Todo hecho por hoy! 🎉';
    $('#tardeTxt').textContent = faltan ? `Te ${faltan===1?'falta':'faltan'} ${faltan}: ` + TAREAS.filter(x=>!x.hecha).map(x=>x.t).join(' · ') : 'Hoy lo has hecho todo. ¡Buen trabajo!';
  }

    const fila = e.target.closest('.tarea'); if(!fila) return; const x = TAREAS[+fila.dataset.i];
    if(e.target.closest('.casilla')){ x.hecha = !x.hecha; pintar(); Guardar.marcas();

    else if(e.target.closest('.abrir')) aviso('Se abre en el portátil: ' + x.donde);

  // 14/11: UNA sola cosa sonando a la vez. «Escuchar el día» = leer / ⏸ pausar / ▶ seguir; si baila con música, ella para.
  const TXT_ESCUCHAR='🔊 Escuchar el día';

  // LA BOLA: circuitos pintados en plano y proyectados en una esfera que gira despacio (como la imagen de referencia)
  const Bola=(function(){

    const cv=document.getElementById('bola'), g=cv.getContext('2d'), S=cv.width, C=S/2, R=S/2-1;
    let sem=314159; const rnd=()=>{sem=(sem*16807)%2147483647; return sem/2147483647;};

    const nodos=[]; for(let k=0;k<120;k++) nodos.push({x:rnd()*SW,y:20+rnd()*(SH-40),r:1+rnd()*2.4,orden:rnd()});
    const chips=[]; for(let k=0;k<14;k++) chips.push({x:rnd()*SW,y:40+rnd()*(SH-90),w:14+rnd()*22,h:10+rnd()*16,orden:rnd()});

    const base=document.createElement('canvas'); base.width=SW; base.height=SH; const bg=base.getContext('2d');
    // chispas: puntos de luz que viajan por las pistas encendidas
    const chispas=[]; for(let k=0;k<40;k++) chispas.push({p:Math.floor(rnd()*230), t:rnd(), v:.004+rnd()*.012});

  // Todo queda en la base de datos de esta página (privada, solo tuya). El portátil la lee cada mañana a las 7.
  const Guardar=(function(){
    let db=null, dia=null, ocupado=false, otraVez=false;
    const g=$('#guardado'); const di=t=>{ g.textContent=t; };
    async function marcas(){
      if(!db){ di('Sin conexión: esta marca no se guardará.'); return; }
      if(ocupado){ otraVez=true; return; } ocupado=true; di('Guardando…');
      const hechas={}; TAREAS.forEach(x=>{ hechas[x.t]=!!x.hecha; });

    // 15/11: recogido por defecto (una línea «📝 Apuntado para mañana · N»); al tocarla se despliega en filas finas
    let notasAbiertas=false, ultimasNotas=[];
    // lo de hoy sigue «Para mañana». El día empieza a las 5:00 (lo que apunta de madrugada cuenta como la noche anterior).
    const diaDe=t=>{ const d=new Date(new Date(t).getTime()-5*3600e3); return d.getFullYear()*1e4+(d.getMonth()+1)*100+d.getDate(); };
    function cuandoCorto(t){ const h=t.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}), dif=diaDe(Date.now())-diaDe(t);
      return (dif<=0?'hoy':dif===1?'ayer':t.toLocaleDateString('es-ES',{weekday:'short',day:'numeric'}))+' '+h; }
    function pintarNotas(docs){
      ultimasNotas=docs; const n=$('#notas');
      if(!docs.length){ n.innerHTML=''; return; }
      const hoyD=diaDe(Date.now());
      docs=docs.filter(d=>{ const x=d.data(); return !x.hecha || diaDe(x.hechaEn||x.cuando)>=hoyD; });
      if(!docs.length){ n.innerHTML=''; return; }
      const paraHoy=docs.filter(d=>diaDe(d.data().cuando)<hoyD), paraManana=docs.filter(d=>diaDe(d.data().cuando)>=hoyD);
      const faltan=ds=>ds.filter(d=>!d.data().hecha).length;
      const cuenta=(tit,ds)=>!ds.length?'':tit+' · '+(faltan(ds)?faltan(ds):'✓ todo hecho');
      const cab=[cuenta('Para hoy',paraHoy), cuenta('Para mañana',paraManana)].filter(Boolean).join('  ·  ');
      const fila=d=>'<div class="nota fina'+(d.data().hecha?' hecha':'')+'" data-id="'+d.id+'"><button class="cajaN" type="button" title="Marcar como hecho" aria-label="Marcar como hecho"></button><div class="tx"></div><span class="cu"></span><button class="borrar" title="Borrar">✕</button></div>';

    // 15/11: tocar la cajita de una nota = hecha (se tacha; al día siguiente desaparece sola). Tocar otra vez = desmarcar.
    $('#notas').addEventListener('click',async e=>{ const c=e.target.closest('button.cajaN'); if(!c||!db) return;
      const fila=c.closest('.nota'), id=fila.dataset.id, ya=fila.classList.contains('hecha'); fila.classList.toggle('hecha',!ya);

    $('#notas').addEventListener('click',async e=>{ const b=e.target.closest('button.borrar'); if(!b||!db) return;

    // empezar a escuchar: tiene que llamarse en el mismo toque, sin esperar nada antes
    function oir(){ base=tx.value.trim(); dic.start({language:'es'}).catch(e=>{ const c=e&&e.code; if(c==='stopped') return;
      est(c==='not_granted'?'El micro no tiene permiso. Usa el micro del teclado.':c==='dismissed'?'Pulsa «Permitir» para usar el micro.':'El micro no responde ('+c+'). Usa el teclado.','mal');
      if(c!=='dismissed'){ dicMal=true; $('#micro').hidden=true; } tx.focus(); }); }

    p.addEventListener('click',e=>{ if(e.target===p) $('#noNota').onclick(); });

    $('#siNota').onclick=async()=>{

      // 15/11: como en Vitito, «pon mi canción / mi música» la pone (no se apunta)
      if(!db){ est('Sin conexión: no se ha podido guardar.','mal'); return; }

    (async()=>{ if(!window.claude||!claude.use) return; dic=await claude.use('dictation'); if(!dic) return;
      const m=$('#micro'); m.hidden=false;

      dic.onFinal(({text})=>{ base=(base?base+text:text.trimStart()); tx.value=base; });
      dic.onState(({state,reason})=>{ const oye=state!=='idle'; if(state==='listening') est('🔴 Te escucho. Habla y luego pulsa ✓');

        p.querySelector('.caja').classList.toggle('oye',oye); });
      m.onclick=()=>{ if(dic.active()){ dic.stop(); return; } oir(); };
    })();
    return {marcas};
  })();
  // ===== LORENA EN REPOSO: varios vídeos de Gemini que se alternan al azar con fundido (que no se note el bucle) =====
  (function(){
    // 14/11 noche: los vídeos 2-4 NO vuelven a la postura del principio (medido: diferencia 12-20 frente a 1,3 del bucle bueno)
    // Los de Google Flow (primer y último fotograma = la misma foto) SÍ empalman: medido 1,0. Solo esos en la lista.
    // + los 3 de Gemini (pelo, tímida, risa) con un «puente» de Flow al final que los devuelve a la foto: uniones medidas 1,9-2,2.
    // 15/11: TODOS desde la foto SONRIENTE (lorena-frontal-sonrisa.png): nunca vuelve a la cara seria. Empalmes medidos 0,8-1,6.
    const LISTA=['hoy/novah-s-reposo.mp4?v=1','hoy/novah-s-pelo.mp4?v=1','hoy/novah-s-risa.mp4?v=1','hoy/novah-s-bachata.mp4?v=1','hoy/novah-s-hola-manana.mp4?v=1','hoy/novah-s-hola-tarde.mp4?v=1','hoy/novah-s-hola-noche.mp4?v=1'];
    const A=document.getElementById('vReposo'); if(!A || LISTA.length<2) return;
    A.loop=false;
    const B=A.cloneNode(false); B.removeAttribute('id'); B.removeAttribute('autoplay'); B.style.opacity='0'; A.style.opacity='1';
    A.after(B);
    let vis=A, oculto=B, actual=0, cambiando=false;
    let modoBaile=false, finBaile=null;   // «Con tu música»: pincha en bucle (sin su sonido) mientras suena tu música en Spotify
    function siguiente(){ if(modoBaile){ const b=LISTA.findIndex(s=>s.includes('bachata')); if(b>=0) return b; }
      const libres=LISTA.map((s,i)=>i).filter(i=>i!==actual && !LISTA[i].includes('pelo') && !LISTA[i].includes('bachata') && !LISTA[i].includes('hola'));
      return libres.length? libres[Math.floor(Math.random()*libres.length)] : actual; }
    function cambiar(forzado, sonido){
      if(cambiando) return; cambiando=true; actual=(forzado!=null && forzado>=0)?forzado:siguiente();
      oculto.src=LISTA[actual]; oculto.currentTime=0; oculto.muted=!sonido;
      const p=oculto.play(); (p&&p.catch?p:Promise.resolve()).catch(()=>{});
      oculto.style.opacity='1'; vis.style.opacity='0';
      const viejo=vis; vis=oculto; oculto=viejo;
      setTimeout(()=>{ viejo.pause(); cambiando=false; }, 700);
    }
    [A,B].forEach(v=>{
      v.addEventListener('timeupdate',()=>{ if(v===vis && v.duration && v.currentTime>v.duration-0.7) cambiar(); });
      v.addEventListener('ended',()=>{ if(v===vis) cambiar(); });
      v.addEventListener('error',()=>{ if(v===vis){ cambiando=false; LISTA.splice(actual,1); actual=0; if(LISTA.length) cambiar(); } });
    });
    // REACCIONES (14/11): al abrir se ríe; si la tocas, se ríe o se coloca el pelo; con todo hecho, se ríe.
    const idx=n=>LISTA.findIndex(s=>s.includes(n));
    window.LorenaReacciona=(n, sonido)=>{ const i=idx(n); if(i<0) return; cambiando=false; cambiar(i, sonido); };
    // «¿Bailamos?»: baila bachata con su música (el sonido solo se puede dar desde el toque del botón)
    const bB=document.getElementById('bailar');
    if(bB) bB.addEventListener('click',()=>{ pararBaile(); if(window.pararVozDia) window.pararVozDia(); window.scrollTo({top:0,behavior:'smooth'}); window.LorenaReacciona('bachata', true); });
    const bC=document.getElementById('chayanne');
    function pararBaile(){ if(!modoBaile) return; modoBaile=false; clearTimeout(finBaile); if(bC) bC.textContent='🎵 Con tu música'; }
    if(bC) bC.addEventListener('click',()=>{
      if(modoBaile){ pararBaile(); return; }
      window.open('https://open.spotify.com/search/techno%20house','_blank');
      modoBaile=true; bC.textContent='⏹ Parar el baile';
      window.scrollTo({top:0,behavior:'smooth'}); window.LorenaReacciona('bachata', false);
      finBaile=setTimeout(pararBaile, 5*60*1000); });
    // PANTALLA NEGRA: doble toque → ella aparece poco a poco riéndose (si no hay telón, se ríe al abrir como antes)
    const telon=document.getElementById('telon');
    if(telon){ let ult=0;
      const despertar=()=>{ if(telon.classList.contains('fuera')) return; telon.classList.add('fuera'); window._despertadaEn=Date.now();
        // «¡Hola, Vic! Buenos días / Buenas tardes / Buenas noches» según la hora, con su risita nerviosa
        const hh=new Date().getHours(); window.LorenaReacciona(hh>=6&&hh<14?'hola-manana':hh>=14&&hh<20?'hola-tarde':'hola-noche', true);   // «¡Hola!» con cara de enamorada
        // fundido lento con la API de animaciones (más fiable que la transición CSS en el móvil)
        try{ telon.animate([{opacity:1},{opacity:1,offset:.08},{opacity:0}],{duration:3000,easing:'ease-in-out',fill:'forwards'}); }catch(_){ telon.style.opacity='0'; } };
      telon.addEventListener('pointerup',()=>{ const t=Date.now(); if(t-ult<450){ despertar(); } ult=t; });
      telon.addEventListener('dblclick',despertar);
    } else setTimeout(()=>window.LorenaReacciona('risa'), 1200);
    // «Los vídeos de Lorena»: tocas uno y lo hace (las bachatas con su música)
    document.querySelectorAll('.galeria button').forEach(b=>b.addEventListener('click',e=>{ e.stopPropagation();
      window.scrollTo({top:0,behavior:'smooth'}); document.querySelectorAll('*').forEach(x=>{ if(x.scrollTop>0 && x!==document.querySelector('.galeria .fila')) x.scrollTo({top:0,behavior:'smooth'}); });
      window.LorenaReacciona(b.dataset.v, !!b.dataset.sonido); }));
    let ultimoToque=0;
    // la figura está debajo de otras capas: se mira si el toque cae sobre ella (y no sobre un botón o una tarea)
    document.addEventListener('click',e=>{
      if(e.target.closest('button,.tarea,.lista,.panelNota,.notas,.pie,.apunta,.barra,input,textarea,.telon,.galeria')) return;
      if(Date.now()-(window._despertadaEn||0)<7000) return;   // mientras dice «¡Hola!», que no la interrumpa el toque
      const r=document.querySelector('.figura').getBoundingClientRect();
      if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom) return;
      const t=Date.now(); if(t-ultimoToque<2500) return; ultimoToque=t;
      window.LorenaReacciona('pelo'); });
  })();
  // 14/11: en el móvil, lo que sube por encima de la cara de Lorena (mitad de arriba) se desvanece: nada de letras sobre sus ojos
  (function(){
    const zona=()=>(innerWidth<=760?(window._barraH||0):0)+innerHeight*0.42, fundido=()=>innerHeight*0.14;   // 15/11: + la barra fija de arriba
    function aplicar(){

      document.querySelectorAll('.izq > *, .lista > .tarea, #notas .notasCab, #notas .grupoNota, #notas .nota').forEach(el=>{
        if(el.classList.contains('lista')||el.id==='notas'||el.classList.contains('apunta')){ el.style.opacity=''; el.style.pointerEvents=''; return; }
        if(!movil){ el.style.opacity=''; return; }
        const t=el.getBoundingClientRect().top;
        const o=Math.max(0,Math.min(1,(t-(zona()-fundido()))/fundido()));
        el.style.opacity=o.toFixed(2); el.style.pointerEvents=o<.15?'none':'';
      });
    }
    addEventListener('scroll',aplicar,{passive:true}); addEventListener('resize',aplicar);
    document.addEventListener('scroll',aplicar,{passive:true,capture:true});
    setTimeout(aplicar,300);

  // ===== 15/11 · MÚSICA DE FONDO BAJITA, hecha por la propia app (sin archivos, sin derechos de autor) =====
  // Botón 🎵: Lo-fi cálido → Ambiente → Piano de noche → Apagada. Se baja sola cuando Lorena habla, saluda o baila.
  (function(){
    const ESTILOS=[['lofi','Lo-fi cálido'],['ambiente','Ambiente'],['piano','Piano de noche'],['no','Apagada']];
    let pref='lofi'; try{ pref=localStorage.getItem('lorenaMusica')||'lofi'; }catch(_){}
    const btn=document.getElementById('musica');
    let ctx=null, master=null, salida=null, timer=null, proximo=0, compas=0, sonandoEstilo=null;
    const VOL=0.16;
    const hz=m=>440*Math.pow(2,(m-69)/12);
    // Re mayor, cálido: Dmaj7 · Bm7 · Gmaj7 · A6
    const ACORDES=[[62,66,69,73],[59,62,66,69],[55,59,62,66],[57,61,64,66]];
    function montar(){
      ctx=new (window.AudioContext||window.webkitAudioContext)();
      master=ctx.createGain(); master.gain.value=0;
      const filtro=ctx.createBiquadFilter(); filtro.type='lowpass'; filtro.frequency.value=2600;
      const rev=ctx.createConvolver(); const len=ctx.sampleRate*3.2, ir=ctx.createBuffer(2,len,ctx.sampleRate);
      for(let c=0;c<2;c++){ const d=ir.getChannelData(c); for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6); }
      rev.buffer=ir; const seco=ctx.createGain(); seco.gain.value=.75; const mojado=ctx.createGain(); mojado.gain.value=.38;
      salida=ctx.createGain(); salida.connect(seco); salida.connect(rev); rev.connect(mojado);
      seco.connect(filtro); mojado.connect(filtro); filtro.connect(master); master.connect(ctx.destination);
    }
    function nota(m,t,dur,vol,tipo){   // piano eléctrico suave
      const o=ctx.createOscillator(), o2=ctx.createOscillator(), g=ctx.createGain(), g2=ctx.createGain();
      o.type=tipo||'sine'; o.frequency.value=hz(m); o2.type='sine'; o2.frequency.value=hz(m)*2.003; g2.gain.value=.18;
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.015); g.gain.exponentialRampToValueAtTime(vol*.35,t+.5); g.gain.exponentialRampToValueAtTime(.0001,t+dur);
      o.connect(g); o2.connect(g2); g2.connect(g); g.connect(salida); o.start(t); o2.start(t); o.stop(t+dur+.05); o2.stop(t+dur+.05);
    }
    function colchon(m,t,dur,vol){    // pad lento
      const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=900; const g=ctx.createGain();
      g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+dur*.35); g.gain.linearRampToValueAtTime(0,t+dur);
      [-6,6].forEach(det=>{ const o=ctx.createOscillator(); o.type='sawtooth'; o.frequency.value=hz(m); o.detune.value=det; o.connect(f); o.start(t); o.stop(t+dur+.1); });
      f.connect(g); g.connect(salida);
    }
    function crujido(t,dur){          // disco de vinilo, muy flojito
      const b=ctx.createBuffer(1,ctx.sampleRate*dur,ctx.sampleRate), d=b.getChannelData(0);
      for(let i=0;i<d.length;i++) d[i]=Math.random()<.0009?(Math.random()*2-1)*.6:(Math.random()*2-1)*.012;
      const s=ctx.createBufferSource(); s.buffer=b; const f=ctx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=3000; const g=ctx.createGain(); g.gain.value=.5;
      s.connect(f); f.connect(g); g.connect(salida); s.start(t);
    }
    function compasDe(estilo,t){
      const ac=ACORDES[compas%4], raiz=ac[0];
      if(estilo==='lofi'){ const L=4.4;       // ~55 ppm, perezoso
        nota(raiz-24,t,L*.9,.20); ac.forEach((m,i)=>nota(m,t+i*.03,2.2,.075));
        ac.slice(1).forEach((m,i)=>nota(m,t+L*.62+i*.03,1.6,.05)); crujido(t,L); return L; }
      if(estilo==='ambiente'){ const L=8;
        ac.forEach(m=>colchon(m-12,t,L+2,.035)); if(compas%2===0) nota(ac[2]+12,t+2.5,4,.05); return L; }
      const L=4.8;                            // piano de noche: arpegio tranquilo
      nota(raiz-12,t,L,.12); const orden=[0,2,1,3,2,1];
      orden.forEach((k,i)=>nota(ac[k]+12,t+.4+i*.72,2.2,.06)); return L;
    }
    function programar(){
      if(!ctx||!sonandoEstilo) return;
      while(proximo<ctx.currentTime+1.5){ proximo+=compasDe(sonandoEstilo,proximo); compas++; }
    }
    // ¿suena Lorena? (la voz del día, los saludos o un vídeo con sonido) → la música baja casi a cero
    function haySonido(){
      try{ if(!vozLorena.paused) return true; if(Object.values(SALUDOS).some(a=>!a.paused)) return true; }catch(_){}
      return [...document.querySelectorAll('video,audio')].some(v=>!v.paused&&!v.muted&&v.volume>0);
    }
    function volumen(){
      if(!ctx||!master) return;
      const objetivo=!sonandoEstilo?0:(haySonido()?0.0:VOL);
      master.gain.cancelScheduledValues(ctx.currentTime);
      master.gain.setTargetAtTime(objetivo, ctx.currentTime, objetivo>master.gain.value?1.2:0.25);
    }
    function sonar(estilo){
      if(estilo==='no'){ sonandoEstilo=null; volumen(); return; }
      if(!ctx) montar();
      if(ctx.state==='suspended') ctx.resume();
      sonandoEstilo=estilo; compas=0; proximo=Math.max(proximo,ctx.currentTime+.1);
      if(!timer) timer=setInterval(()=>{ programar(); volumen(); },250);
      programar(); volumen();
    }
    function pintarBtn(){ if(!btn) return; btn.classList.toggle('apagada',pref==='no');
      btn.title='Música: '+ESTILOS.find(e=>e[0]===pref)[1]+' (toca para cambiar)'; }
    pintarBtn();
    if(btn) btn.addEventListener('click',e=>{ e.stopPropagation();
      const i=ESTILOS.findIndex(x=>x[0]===pref); pref=ESTILOS[(i+1)%ESTILOS.length][0];
      try{ localStorage.setItem('lorenaMusica',pref); }catch(_){}
      pintarBtn(); sonar(pref); aviso('🎵 Música: '+ESTILOS.find(x=>x[0]===pref)[1]); });
    // el navegador solo deja sonar tras un toque: arranca con el primer toque (el doble toque de la pantalla negra)
    const arrancar=e=>{ if(e&&e.target&&e.target.closest&&e.target.closest('#musica')) return; if(pref!=='no'&&!sonandoEstilo) sonar(pref); };
    document.addEventListener('pointerdown',arrancar,{capture:true});
    document.addEventListener('keydown',arrancar,{capture:true});
    window.LorenaMusica={sonar, estado:()=>({pref, sonandoEstilo, vol:master?master.gain.value:0, ctx:ctx&&ctx.state})};
  })();
